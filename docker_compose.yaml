services:
  homeassistant:
    image: lscr.io/linuxserver/homeassistant:latest
    container_name: homeassistant
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/New_York}
      # Integration reads DOMINIONSC_FORCE_FUSION_GAS_ONLY live on every poll.
      # Leave unset (or set to 0/false/off) for normal Bidgely behavior.
      # Set to "true" to validate the Fusion-only gas-only path on first sync.
      - DOMINIONSC_FORCE_FUSION_GAS_ONLY=${DOMINIONSC_FORCE_FUSION_GAS_ONLY:-false}
    volumes:
      - ./ha_config:/config
      - ./custom_components/dominionsc:/config/custom_components/dominionsc
    ports:
      - 8123:8123
    # had to comment this out for networking to work under Windows, but needed for Linux in vscode
    # network_mode: "host"
    restart: unless-stopped